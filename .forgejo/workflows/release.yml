name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

# Sole release pipeline. The self-hosted Forgejo runner builds the
# tagged artefacts and publishes them to GitHub Releases at
# `goodnet-io/goodnet` via the `gh` CLI. Requires the per-repo
# secret `GH_TOKEN` (scopes: classic `repo`, or a fine-grained
# token with `contents:write` on `goodnet-io/goodnet`). The token
# is set in the Forgejo web UI under
# `Repo Settings → Actions → Secrets → Add`.
#
# Matrix is x86_64-only — no aarch64 runner is registered on the
# Forgejo instance. The mingw windows cross-build keeps its place
# because it runs on the same linux runner via `pkgsCross.mingwW64`.

jobs:
  build-linux:
    runs-on: nixos
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { triple: x86_64 }
    steps:
      - uses: actions/checkout@v4

      - name: Build with Nix
        run: nix build --print-build-logs

      - name: Bundle portable release
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TRIPLE="${{ matrix.arch.triple }}"

          mkdir -p release/bin release/lib release/plugins

          if [ -d result/bin ]; then
            cp -r result/bin/* release/bin/ 2>/dev/null || true
          fi

          if [ -d result/plugins ]; then
            cp -r result/plugins/* release/plugins/ 2>/dev/null || true
          fi

          # Carry the shared libraries the binary and plugins resolve
          # against from the Nix store, so the tarball runs on a stock
          # glibc Linux without re-installing dependencies.
          for bin in release/bin/*; do
            [ -f "$bin" ] || continue
            ldd "$bin" 2>/dev/null | { grep '/nix/store/' || true; } | awk '{print $3}' | sort -u | while read -r lib; do
              [ -f "$lib" ] && cp "$lib" release/lib/ 2>/dev/null || true
            done
          done

          find release/plugins -name '*.so' -exec ldd {} \; 2>/dev/null \
            | { grep '/nix/store/' || true; } | awk '{print $3}' | sort -u | while read -r lib; do
            [ -f "$lib" ] && [ ! -f "release/lib/$(basename "$lib")" ] && cp "$lib" release/lib/ 2>/dev/null || true
          done

          chmod -R u+w release/

          # Repoint dynamic linker and rpath so the bundled binary
          # finds its libraries through $ORIGIN, not the Nix store.
          # The interpreter path is arch-specific.
          if [ "$TRIPLE" = "aarch64" ]; then
            INTERP=/lib/ld-linux-aarch64.so.1
          else
            INTERP=/lib64/ld-linux-x86-64.so.2
          fi
          nix shell nixpkgs#patchelf --command bash -c "
            set -euo pipefail
            for bin in release/bin/*; do
              [ -f \"\$bin\" ] || continue
              patchelf --set-interpreter '$INTERP' \"\$bin\" 2>/dev/null || true
              patchelf --set-rpath '\$ORIGIN/../lib' \"\$bin\" 2>/dev/null || true
            done
            find release/lib -name '*.so*' -exec patchelf --set-rpath '\$ORIGIN' {} \; 2>/dev/null || true
            find release/plugins -name '*.so' -exec patchelf --set-rpath '\$ORIGIN/../../lib' {} \; 2>/dev/null || true
          "

          tar czf "goodnet-${TAG}-linux-${TRIPLE}.tar.gz" -C release .

      - name: Generate SHA-256SUMS
        run: |
          TAG="${GITHUB_REF_NAME}"
          TRIPLE="${{ matrix.arch.triple }}"
          sha256sum "goodnet-${TAG}-linux-${TRIPLE}.tar.gz" \
            > "goodnet-${TAG}-linux-${TRIPLE}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ matrix.arch.triple }}
          path: |
            goodnet-*-linux-${{ matrix.arch.triple }}.tar.gz
            goodnet-*-linux-${{ matrix.arch.triple }}.tar.gz.sha256

  build-windows:
    # Windows MVP cross-build via `pkgs.pkgsCross.mingwW64` from a
    # Linux runner. Single static-plugin `goodnet.exe` + the mingw
    # runtime DLLs (libstdc++, libgcc, libwinpthread, libsodium,
    # spdlog, fmt). Native MSVC build remains a follow-up — mingw
    # cross is enough to ship a working binary today, and the
    # Linux-host derivation cohabits with the existing nix cache
    # path.
    runs-on: nixos
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cross-build Windows via mingw
        run: nix build .#goodnet-windows --print-build-logs
      - name: Bundle Windows zip
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release-windows
          cp -L result/bin/*.exe release-windows/
          cp -L result/bin/*.dll release-windows/
          cd release-windows
          nix shell nixpkgs#zip --command zip -r "../goodnet-${TAG}-windows-x86_64.zip" .
      - name: Generate SHA-256
        run: |
          TAG="${GITHUB_REF_NAME}"
          sha256sum "goodnet-${TAG}-windows-x86_64.zip" \
            > "goodnet-${TAG}-windows-x86_64.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-x86_64
          path: |
            goodnet-*-windows-x86_64.zip
            goodnet-*-windows-x86_64.zip.sha256

  # The kernel is a library + plugin .so set + headers; it does
  # not ship a docker image of its own. The daemon binary
  # `goodnetd` (the only entrypoint a container has reason to
  # ship) lives at github.com/GoodNet-io/goodnetd and carries
  # its own release.yml with the docker push step. Operators
  # who want a runnable container pull that repo.

  changelog:
    runs-on: nixos
    outputs:
      notes: ${{ steps.gen.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate auto-changelog between tags
        id: gen
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Previous tag matching `v*` (excluding the current one) —
          # falls back to the repository's first commit if no prior tag.
          PREV=$(git describe --tags --abbrev=0 --match='v*' "${TAG}^" 2>/dev/null \
                  || git rev-list --max-parents=0 HEAD | tail -1)
          {
            echo 'notes<<EOF'
            echo "## Changes since ${PREV}"
            echo
            git log --format='- %s (%h)' "${PREV}..${TAG}"
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  release:
    needs: [build-linux, build-windows, changelog]
    runs-on: nixos
    env:
      # `GH_TOKEN` is the per-repo Forgejo secret carrying a GitHub
      # token (classic `repo` scope, or fine-grained `contents:write`
      # on goodnet-io/goodnet). `gh` reads it from this env var
      # automatically — no `gh auth login` needed.
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GH_REPO: goodnet-io/goodnet
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-release-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-release-*
          merge-multiple: true

      - name: Write changelog notes to file
        run: |
          cat > release-notes.md <<'NOTES_EOF'
          ${{ needs.changelog.outputs.notes }}
          NOTES_EOF

      - name: Publish to GitHub Releases via gh CLI
        # `gh` is fetched on demand from nixpkgs; the runner is Nix-
        # native so the binary lives in the local store after the
        # first tag. Create-vs-upload split keeps re-running the
        # workflow on the same tag idempotent (uploads only overwrite
        # via `--clobber`; the release row itself stays).
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          export TAG
          nix shell nixpkgs#gh --command bash -euo pipefail -c '
            assets=(
              "goodnet-${TAG}-linux-x86_64.tar.gz"
              "goodnet-${TAG}-linux-x86_64.tar.gz.sha256"
              "goodnet-${TAG}-windows-x86_64.zip"
              "goodnet-${TAG}-windows-x86_64.zip.sha256"
            )
            if gh release view "${TAG}" >/dev/null 2>&1; then
              gh release upload "${TAG}" "${assets[@]}" --clobber
            else
              gh release create "${TAG}" "${assets[@]}" \
                --title "${TAG}" \
                --notes-file release-notes.md
            fi
          '
