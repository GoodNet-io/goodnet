name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Public-facing smoke gate. The full matrix (build-and-test,
# plugin-verify, windows-cross-build, bench-smoke, ice-3node,
# fuzz-smoke, asan-smoke, tsan-smoke) runs on the project's
# self-hosted Forgejo runner — see `.forgejo/workflows/ci.yml`
# and `docs/operator/ci-forgejo-setup.en.md`. Only the two
# cheap checks live here so the GitHub-side badge is meaningful
# on a public clone without burning hosted-runner minutes on the
# heavy jobs. `magic-nix-cache-action` is intentionally absent;
# both jobs are inside the free quota with a cold Nix install.

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: nix flake check
        run: nix flake check --print-build-logs

  livedoc-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Run livedoc --check
        run: nix develop --command python3 tools/livedoc.py --check
      - name: Run python tests
        run: nix develop --command pytest
