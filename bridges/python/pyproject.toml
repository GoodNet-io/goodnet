[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goodnet"
version = "0.1.0"
description = "Python bindings for the GoodNet network kernel"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "GoodNet contributors" },
]
keywords = ["goodnet", "p2p", "network", "kernel", "cffi", "bindings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "cffi>=1.16",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/GoodNet-io/goodnet"
Source = "https://github.com/GoodNet-io/goodnet"

[tool.setuptools.packages.find]
include = ["goodnet*"]
exclude = ["tests*"]
