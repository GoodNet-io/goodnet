[package]
name        = "goodnet-sys"
version     = "0.1.0"
edition     = "2021"
license     = "MIT"
description = "Raw FFI bindings for the GoodNet kernel C ABI (sdk/core.h)."
# `links` records the native library this crate exclusively binds. Cargo
# enforces a one-crate-per-native-library rule against this key so two
# transitive copies of `goodnet-sys` in the same dep graph fail fast
# instead of silently double-linking the kernel. The string is a Cargo
# identifier; the actual link line is emitted from `build.rs` (the
# `cargo:rustc-link-lib` directive picks the on-disk soname).
links       = "goodnet_kernel"

[lib]
crate-type = ["rlib"]

[build-dependencies]
bindgen    = "0.69"
pkg-config = "0.3"
