rfcs:
- rfc: 8445
  title: Interactive Connectivity Establishment (ICE)
  area: ICE / NAT traversal
  status: full
  implementation: plugins/links/ice
  notes: Triggered Checks §7.3.1.4, Regular Nomination §8.1.1 (aggressive via ice.aggressive_nomination),
    full controlled/controlling state machine.
- rfc: 5389
  title: Session Traversal Utilities for NAT (STUN)
  area: ICE / NAT traversal
  status: full
  implementation: plugins/links/ice
  notes: Including §7.2.2 16-bit length-prefix framing for STUN-over-TCP / TLS.
- rfc: 5766
  title: Traversal Using Relays around NAT (TURN)
  area: ICE / NAT traversal
  status: full
  implementation: plugins/links/ice
  notes: ChannelBind / ChannelData fast path §11, allocation, permissions, Send-Indication
    fallback.
- rfc: 6062
  title: TURN Extensions for TCP Allocations
  area: ICE / NAT traversal
  status: partial
  implementation: plugins/links/ice
  notes: 'REQUESTED-TRANSPORT=6 in ALLOCATE per §6; Connect / ConnectionBind for per-peer
    data connections (§4.3-§4.5); ConnectionAttempt indication parsed and dispatched
    to a fresh data carrier; session-side wiring of the data- carrier factory is operator-driven
    (TurnConfig:: requested_transport).'
- rfc: 8838
  title: Trickle ICE for SDP
  area: ICE / NAT traversal
  status: full
  implementation: plugins/links/ice
  notes: End-of-candidates marker §10 signalled via OFFER_EOC / ANSWER_EOC; outbound
    poll surface `poll_local` in `gn_link_ice_signal_api_t` drains queued local candidate
    blobs for out-of-process signalling bridges. Full SDP integration out of scope
    (kernel uses a key-exchange- based offer/answer, not SDP).
- rfc: 8305
  title: Happy Eyeballs Version 2
  area: ICE / NAT traversal
  status: partial
  implementation: plugins/links/ice
  notes: Dual-family pre-fire in begin_checks; full DNS-stage staggering not relevant
    — ICE works with already-resolved candidates.
- rfc: 8899
  title: Packetization Layer Path MTU Discovery for Datagram Transports
  area: ICE / NAT traversal
  status: full
  implementation: plugins/links/ice
  notes: DPLPMTUD probe state machine in path_mtu.{hpp,cpp}; STUN binding-request
    padding the probe to the candidate MTU; convergence within kProbeGranularity bytes.
- rfc: 8085
  title: UDP Usage Guidelines
  area: ICE / NAT traversal
  status: full
  implementation: plugins/links/ice
  notes: Pacing + consent-freshness compliant; verified in unit tests.
- rfc: 6886
  title: NAT Port Mapping Protocol (NAT-PMP)
  area: ICE / NAT traversal
  status: full
  implementation: plugins/links/portmap
  notes: 12-byte request / 16-byte response on UDP/5351; default gateway resolved
    from `/proc/net/route`; lifetime renewal at `lifetime_s / 2` cadence per §3.3.
- rfc: 6887
  title: Port Control Protocol (PCP)
  area: ICE / NAT traversal
  status: partial
  implementation: plugins/links/portmap
  notes: MAP opcode — 60-byte request (24-byte common header + 36-byte body); client
    IP carried as IPv4-mapped IPv6. PEER / FILTER opcodes deliberately out of scope
    for v1.
- rfc: 6970
  title: Universal Plug and Play (UPnP) Internet Gateway Device-Port Control Protocol
    Interworking Function (IGD-PCP IWF)
  area: ICE / NAT traversal
  status: full
  implementation: plugins/links/portmap
  notes: 'UPnP IGD-D 1.0 / 2.0 control surface: SSDP M-SEARCH on `239.255.255.250:1900`
    (MX = 2 s) → HTTP GET device description → `WANIPConnection:1` `<controlURL>`
    extraction → SOAP `AddPortMapping` + `GetExternalIPAddress`. `:2` accepted as
    wire-compatible fallback. Hand-rolled HTTP / SSDP socket layer (no curl / Boost
    dep); live-router integration test gated on `GN_PORTMAP_UPNP_LIVE_TEST`.'
- rfc: 6762
  title: Multicast DNS
  area: ICE / NAT traversal
  status: partial
  implementation: plugins/links/ice
  notes: Minimal responder + resolver in mdns.{hpp,cpp} for ICE host-candidate obfuscation.
    A/AAAA query/response over 224.0.0.251:5353; probe-then-announce omitted; system
    mDNS daemon coexistence relies on SO_REUSEPORT.
- rfc: draft-ietf-mmusic-mdns-ice-candidates
  title: Using Multicast DNS to Protect Privacy When Exposing ICE Candidates
  area: ICE / NAT traversal
  status: partial
  implementation: plugins/links/ice
  notes: CandidateType::HostMdns wire variant emits `<uuid>.local` when `ice.mdns_obfuscate_host_candidates`
    is true. Remote HostMdns candidates resolve asynchronously through the shared
    MdnsManager (default timeout 5 s). Linux-only host- IP enumeration today; macOS
    / Windows responder is mute without enumeration.
- rfc: 7748
  title: Elliptic Curves for Security (Curve25519, Curve448)
  area: Noise / cryptography
  status: full
  implementation: plugins/security/noise
  notes: X25519 ECDH via libsodium; aligned with the Noise spec.
- rfc: 7693
  title: BLAKE2 Crypto Hash and MAC
  area: Noise / cryptography
  status: full
  implementation: plugins/security/noise
  notes: Used for Noise CipherState init via libsodium.
- rfc: 9000
  title: QUIC — A UDP-Based Multiplexed and Secure Transport
  area: QUIC
  status: full
  implementation: plugins/links/quic
  notes: 'OpenSSL-3.6-native QUIC (OSSL_QUIC_server_method / OSSL_QUIC_client_method
    + SSL_new_stream); works over plain UDP carrier. Carrier scheme detect: 64-hex
    peer-pk → gn.link.ice carrier. Unit coverage: QuicComposer.HandshakeAndPayloadRoundTrip
    (QUIC-over-UDP) and QuicLink.ComposerConnectIcePeerPkRoutesToIceCarrier (route
    detection). End-to-end handshake over an ICE- nominated pair exercised by tests/docker/ice-3node
    scenarios/quic_over_ice.yml.'
- rfc: 8446
  title: TLS 1.3
  area: TLS
  status: full
  implementation: plugins/links/tls
  notes: OpenSSL backend; TLS 1.3 minimum pinned in plugins/links/tls.
- rfc: 9147
  title: DTLS 1.3
  area: TLS
  status: full
  implementation: plugins/links/tls
  notes: Raw `SSL_CTX_new(DTLS_method())` for the dtls:// scheme (asio 1.36 has no
    DTLS context family). Shares credentials, verify policy, and cipher list with
    the TCP TLS 1.3 path. WebRTC / CoAP / IoT interop carrier.
- rfc: 6455
  title: The WebSocket Protocol
  area: WebSocket
  status: full
  implementation: plugins/links/ws
  notes: Server + client framing including masking (64-bit-word unmask hot loop in
    `wire.hpp::apply_mask`), control frames, close codes, §5.4 fragmentation reassembly
    (max 16 MiB merged, single-frame cap 64 KiB).
- rfc: 7692
  title: Compression Extensions for WebSocket (permessage-deflate)
  area: WebSocket
  status: not-implemented
  implementation: plugins/links/ws
  notes: 'A client offering `Sec-WebSocket-Extensions: permessage- deflate` in handshake
    gets a response with no `Sec-WebSocket-Extensions` echo — per RFC 7692 §5.1 the
    extension never activates and the conn falls back to uncompressed frames.'
- rfc: 5389
  title: STUN — Short-Term Credential (alias)
  area: WebSocket
  status: out
  implementation: ''
  notes: Not applicable to ws transport; listed once under ICE.
