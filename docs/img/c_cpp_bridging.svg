<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  c_cpp_bridging.svg — C ABI boundary between plugin and kernel,
  refreshed to include the per-language bridges (cpp / python /
  rust / js) that now sit alongside the historical C++-only path.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600"
     viewBox="0 0 1180 600" font-family="JetBrains Mono,Fira Code,monospace">
  <title>C ABI boundary  —  plugin / bridge / kernel</title>
  <desc>The C ABI (host_api_t + four vtable types) is the only
        contract crossing plugin or bridge into kernel. Bridges in
        cpp / python / rust / js all sit above this same surface.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#585b70"/>
    </marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f9e2af"/>
    </marker>
  </defs>

  <rect width="1180" height="600" fill="#1e1e2e"/>

  <text x="24" y="34" fill="#cdd6f4" font-size="15" font-weight="bold">
    C ABI boundary  —  one contract, four languages above it
  </text>
  <text x="24" y="52" fill="#585b70" font-size="11">
    Every language binding marshals into the same extern "C", api_size-versioned vtables. No exceptions cross; status is GN_OK / error code.
  </text>

  <!-- ════ Above the line: bridges + plugins ════ -->
  <g>
    <rect x="24" y="72" width="500" height="220" rx="8"
          fill="#181825" stroke="#fab387" stroke-width="1.5"/>
    <text x="36" y="94" fill="#fab387" font-size="12" font-weight="bold">
      Plugin .so  —  C++ implementation (in-tree default)
    </text>

    <rect x="48" y="108" width="220" height="160" rx="6"
          fill="#45475a" stroke="#fab387" stroke-width="1.5"/>
    <text x="60" y="128" fill="#fab387" font-size="10" font-weight="bold">class MyHandler</text>
    <text x="60" y="146" fill="#cdd6f4" font-size="9">: public goodnet::HandlerBase</text>
    <text x="60" y="162" fill="#cdd6f4" font-size="9">(sdk/cpp/handler.hpp)</text>
    <text x="60" y="186" fill="#cdd6f4" font-size="9">on_message(envelope) → ...</text>
    <text x="60" y="200" fill="#cdd6f4" font-size="9">subscribe_conn_state(cb, ud)</text>
    <text x="60" y="214" fill="#cdd6f4" font-size="9">query_extension_checked(name, ver)</text>
    <text x="60" y="234" fill="#cdd6f4" font-size="9">send(conn, msg_id, payload)</text>
    <text x="60" y="248" fill="#cdd6f4" font-size="9">set_timer(ms, fn, ud)</text>

    <rect x="284" y="108" width="220" height="160" rx="6"
          fill="#45475a" stroke="#f9e2af" stroke-width="1.5"/>
    <text x="296" y="128" fill="#f9e2af" font-size="10" font-weight="bold">Static trampolines</text>
    <text x="296" y="146" fill="#cdd6f4" font-size="9">static gn_propagation_t handle(</text>
    <text x="296" y="160" fill="#cdd6f4" font-size="9">    void* self, …) {</text>
    <text x="296" y="174" fill="#cdd6f4" font-size="9">  return static_cast&lt;MyHandler*&gt;(self)</text>
    <text x="296" y="188" fill="#cdd6f4" font-size="9">      -&gt;on_message(envelope);</text>
    <text x="296" y="202" fill="#cdd6f4" font-size="9">}</text>
    <text x="296" y="222" fill="#cdd6f4" font-size="9">one trampoline per vtable slot</text>
    <text x="296" y="236" fill="#cdd6f4" font-size="9">cost: 1 indirect call + cast</text>
    <text x="296" y="252" fill="#585b70" font-size="9">no exceptions cross the line</text>
  </g>

  <!-- ════ Bridges row ════ -->
  <g>
    <rect x="548" y="72" width="608" height="220" rx="8"
          fill="#181825" stroke="#94e2d5" stroke-width="1.5"/>
    <text x="560" y="94" fill="#94e2d5" font-size="12" font-weight="bold">
      Bridges  —  same C ABI consumed by four languages
    </text>

    <rect x="572" y="108" width="140" height="160" rx="6"
          fill="#45475a" stroke="#fab387" stroke-width="1.2"/>
    <text x="584" y="128" fill="#fab387" font-size="10" font-weight="bold">bridges/cpp</text>
    <text x="584" y="146" fill="#cdd6f4" font-size="9">re-export of sdk/cpp/</text>
    <text x="584" y="160" fill="#cdd6f4" font-size="9">goodnet::Core,</text>
    <text x="584" y="174" fill="#cdd6f4" font-size="9">goodnet::Identity</text>
    <text x="584" y="194" fill="#cdd6f4" font-size="9">CMake target</text>
    <text x="584" y="208" fill="#cdd6f4" font-size="9">goodnet::cpp</text>
    <text x="584" y="228" fill="#fab387" font-size="9">status: GREEN</text>

    <rect x="724" y="108" width="140" height="160" rx="6"
          fill="#45475a" stroke="#a6e3a1" stroke-width="1.2"/>
    <text x="736" y="128" fill="#a6e3a1" font-size="10" font-weight="bold">bridges/python</text>
    <text x="736" y="146" fill="#cdd6f4" font-size="9">pybind11 over</text>
    <text x="736" y="160" fill="#cdd6f4" font-size="9">sdk/core.h</text>
    <text x="736" y="180" fill="#cdd6f4" font-size="9">goodnet.Core(),</text>
    <text x="736" y="194" fill="#cdd6f4" font-size="9">goodnet.Handler</text>
    <text x="736" y="214" fill="#cdd6f4" font-size="9">GIL released</text>
    <text x="736" y="228" fill="#cdd6f4" font-size="9">across kernel calls</text>
    <text x="736" y="248" fill="#a6e3a1" font-size="9">status: GREEN</text>

    <rect x="876" y="108" width="140" height="160" rx="6"
          fill="#45475a" stroke="#fab387" stroke-width="1.2"/>
    <text x="888" y="128" fill="#fab387" font-size="10" font-weight="bold">bridges/rust</text>
    <text x="888" y="146" fill="#cdd6f4" font-size="9">bindgen + safe</text>
    <text x="888" y="160" fill="#cdd6f4" font-size="9">wrapper crate</text>
    <text x="888" y="180" fill="#cdd6f4" font-size="9">goodnet::Core,</text>
    <text x="888" y="194" fill="#cdd6f4" font-size="9">goodnet::Identity</text>
    <text x="888" y="214" fill="#cdd6f4" font-size="9">async (futures)</text>
    <text x="888" y="228" fill="#cdd6f4" font-size="9">no_std feature</text>
    <text x="888" y="248" fill="#fab387" font-size="9">status: PEACH</text>

    <rect x="1028" y="108" width="116" height="160" rx="6"
          fill="#45475a" stroke="#f9e2af" stroke-width="1.2"/>
    <text x="1040" y="128" fill="#f9e2af" font-size="10" font-weight="bold">bridges/js</text>
    <text x="1040" y="146" fill="#cdd6f4" font-size="9">TS / Emscripten</text>
    <text x="1040" y="160" fill="#cdd6f4" font-size="9">over WASM kernel</text>
    <text x="1040" y="180" fill="#cdd6f4" font-size="9">GoodnetClient</text>
    <text x="1040" y="200" fill="#cdd6f4" font-size="9">npm package</text>
    <text x="1040" y="214" fill="#cdd6f4" font-size="9">@goodnet/client</text>
    <text x="1040" y="248" fill="#f9e2af" font-size="9">status: YELLOW</text>
  </g>

  <!-- ════ THE C ABI BAND ════ -->
  <g>
    <rect x="24" y="312" width="1132" height="106" rx="8"
          fill="#45475a" stroke="#f9e2af" stroke-width="2.0"/>
    <text x="36" y="334" fill="#f9e2af" font-size="13" font-weight="bold">
      C ABI boundary  —  the only contract
    </text>
    <text x="36" y="354" fill="#cdd6f4" font-size="10">
      host_api_t          (kernel → plugin / bridge)    41 named slots + 8 reserved
    </text>
    <text x="36" y="370" fill="#cdd6f4" font-size="10">
      gn_handler_vtable_t        (plugin → kernel)    6 named + 4 reserved
    </text>
    <text x="36" y="386" fill="#cdd6f4" font-size="10">
      gn_link_vtable_t           (plugin → kernel)    9 named + 4 reserved
    </text>
    <text x="36" y="402" fill="#cdd6f4" font-size="10">
      gn_security_provider_vtable_t (plugin → kernel) 11 named + 4 reserved      ·    all extern "C", api_size first, _reserved tail
    </text>
  </g>

  <!-- ════ Below the line: kernel ════ -->
  <g>
    <rect x="24" y="440" width="1132" height="140" rx="8"
          fill="#181825" stroke="#b4befe" stroke-width="1.5"/>
    <text x="36" y="464" fill="#b4befe" font-size="12" font-weight="bold">
      Kernel  —  opaque C++ implementation (core/)
    </text>

    <rect x="48" y="478" width="248" height="88" rx="6"
          fill="#45475a" stroke="#a6e3a1" stroke-width="1.2"/>
    <text x="60" y="498" fill="#a6e3a1" font-size="10" font-weight="bold">HandlerRegistry / LinkRegistry</text>
    <text x="60" y="514" fill="#cdd6f4" font-size="9">GN_REGISTER_HANDLER, etc.</text>
    <text x="60" y="528" fill="#cdd6f4" font-size="9">sharded by protocol_id / scheme</text>
    <text x="60" y="542" fill="#cdd6f4" font-size="9">copies vtable + self into shard</text>
    <text x="60" y="558" fill="#585b70" font-size="9">no plugin pointer leaks across shards</text>

    <rect x="312" y="478" width="248" height="88" rx="6"
          fill="#45475a" stroke="#cba6f7" stroke-width="1.2"/>
    <text x="324" y="498" fill="#cba6f7" font-size="10" font-weight="bold">SecurityRegistry</text>
    <text x="324" y="514" fill="#cdd6f4" font-size="9">register_security(name, vt, self)</text>
    <text x="324" y="528" fill="#cdd6f4" font-size="9">handshake_open / step / complete</text>
    <text x="324" y="542" fill="#cdd6f4" font-size="9">drives per-conn state machine</text>
    <text x="324" y="558" fill="#585b70" font-size="9">noise / pkcs11 / null providers</text>

    <rect x="576" y="478" width="248" height="88" rx="6"
          fill="#45475a" stroke="#94e2d5" stroke-width="1.2"/>
    <text x="588" y="498" fill="#94e2d5" font-size="10" font-weight="bold">ExtensionRegistry</text>
    <text x="588" y="514" fill="#cdd6f4" font-size="9">register_extension(name, ver, vt)</text>
    <text x="588" y="528" fill="#cdd6f4" font-size="9">looked up via query_extension_checked</text>
    <text x="588" y="542" fill="#cdd6f4" font-size="9">gn.handler.* / gn.identity.* / …</text>
    <text x="588" y="558" fill="#585b70" font-size="9">plugin-to-plugin without headers</text>

    <rect x="840" y="478" width="296" height="88" rx="6"
          fill="#45475a" stroke="#89b4fa" stroke-width="1.2"/>
    <text x="852" y="498" fill="#89b4fa" font-size="10" font-weight="bold">ServiceExecutor + SignalChannel</text>
    <text x="852" y="514" fill="#cdd6f4" font-size="9">set_timer / posted tasks</text>
    <text x="852" y="528" fill="#cdd6f4" font-size="9">conn_state / config_reload broadcast</text>
    <text x="852" y="542" fill="#cdd6f4" font-size="9">subscribe_* — multi-consumer</text>
    <text x="852" y="558" fill="#585b70" font-size="9">also: ConnectionRegistry (3 keys / 16 shards)</text>
  </g>

  <!-- Arrows: plugin → ABI -->
  <path d="M 270 292 L 270 312" stroke="#f9e2af" stroke-width="1.5"
        fill="none" marker-end="url(#arrY)"/>
  <text x="180" y="306" fill="#f9e2af" font-size="9">api-&gt;send(api-&gt;host_ctx, …)</text>

  <path d="M 394 292 L 394 312" stroke="#f9e2af" stroke-width="1.5"
        fill="none" marker-end="url(#arrY)"/>
  <text x="408" y="306" fill="#f9e2af" font-size="9">handler_vtable-&gt;handle_message(self, …)</text>

  <!-- Arrows: bridges → ABI -->
  <path d="M 642 292 L 642 312" stroke="#f9e2af" stroke-width="1.2"
        fill="none" marker-end="url(#arrY)"/>
  <path d="M 794 292 L 794 312" stroke="#f9e2af" stroke-width="1.2"
        fill="none" marker-end="url(#arrY)"/>
  <path d="M 946 292 L 946 312" stroke="#f9e2af" stroke-width="1.2"
        fill="none" marker-end="url(#arrY)"/>
  <path d="M 1086 292 L 1086 312" stroke="#f9e2af" stroke-width="1.2"
        fill="none" marker-end="url(#arrY)"/>

  <!-- Arrows: ABI → kernel -->
  <path d="M 172 418 L 172 478" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 436 418 L 436 478" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 700 418 L 700 478" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 988 418 L 988 478" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>

</svg>
