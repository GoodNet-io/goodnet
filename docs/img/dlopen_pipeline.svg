<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  dlopen_pipeline.svg — plugin load pipeline through the
  IPluginRuntime abstraction layer added by sdk/plugin_runtime.h.
  The kernel no longer hard-codes dlopen; the same phases run
  against any of {static, dynamic, remote, wasm-plugin} runtimes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080"
     viewBox="0 0 1080 1080" font-family="JetBrains Mono,Fira Code,monospace">
  <title>Plugin load / shutdown pipeline (runtime-abstracted)</title>
  <desc>10-phase plugin pipeline routed through the IPluginRuntime
        abstraction. Phases 1-6 = start-up, 7-10 = teardown.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#585b70"/>
    </marker>
  </defs>

  <rect width="1080" height="1080" fill="#1e1e2e"/>

  <text x="24" y="34" fill="#cdd6f4" font-size="15" font-weight="bold">
    Plugin pipeline  —  same 10 phases routed via IPluginRuntime
  </text>
  <text x="24" y="52" fill="#585b70" font-size="11">
    Kernel doesn't dlopen directly any more; PluginManager::open_one delegates to a runtime vtable (static / dynamic / remote / wasm-plugin).
  </text>

  <!-- Runtime selector at the top -->
  <g>
    <rect x="304" y="80" width="472" height="120" rx="6"
          fill="#181825" stroke="#cba6f7" stroke-width="1.5"/>
    <text x="316" y="100" fill="#cba6f7" font-size="11" font-weight="bold">PluginManager — runtime selector  (core/plugin/)</text>
    <text x="316" y="118" fill="#cdd6f4" font-size="10">manifest declares kind = "static" | "dynamic" | "remote" | "wasm-plugin"</text>
    <text x="316" y="134" fill="#cdd6f4" font-size="10">runtime registered via gn_core_register_runtime (sdk/core.h)</text>
    <text x="316" y="150" fill="#cdd6f4" font-size="10">selector looks up IPluginRuntime* by kind, dispatches phases 2–10 to it</text>
    <text x="316" y="166" fill="#cdd6f4" font-size="10">built-in kinds: static / dynamic / remote — see core/plugin/runtimes/</text>
    <text x="316" y="182" fill="#cdd6f4" font-size="10">custom kinds: register via sdk/plugin_runtime.h vtable (api_size-versioned)</text>
    <text x="316" y="196" fill="#585b70" font-size="9">same phase order regardless of runtime — see plugin-lifetime.en.md §2</text>
  </g>

  <!-- ═══ Start-up phases (column) ═══ -->
  <g>
    <text x="36" y="232" fill="#a6e3a1" font-size="11" font-weight="bold">Start-up  —  phases 1 → 6</text>

    <rect x="36" y="246" width="496" height="56" rx="6"
          fill="#45475a" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="48" y="266" fill="#89b4fa" font-size="10" font-weight="bold">1.  PluginManager::discover</text>
    <text x="48" y="282" fill="#cdd6f4" font-size="9">scan plugin manifest files</text>
    <text x="48" y="294" fill="#cdd6f4" font-size="9">→ load order, runtime kind per plugin</text>

    <rect x="36" y="316" width="496" height="56" rx="6"
          fill="#45475a" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="48" y="336" fill="#a6e3a1" font-size="10" font-weight="bold">2.  runtime-&gt;load(path / module-id)</text>
    <text x="48" y="352" fill="#cdd6f4" font-size="9">dynamic: dlopen(path, RTLD_LAZY|RTLD_LOCAL)</text>
    <text x="48" y="364" fill="#cdd6f4" font-size="9">static: lookup in built-in registry; wasm-plugin: instantiate WASM module</text>

    <rect x="36" y="386" width="496" height="56" rx="6"
          fill="#45475a" stroke="#b4befe" stroke-width="1.5"/>
    <text x="48" y="406" fill="#b4befe" font-size="10" font-weight="bold">3.  gn_plugin_sdk_version(&amp;maj, &amp;min, &amp;patch)</text>
    <text x="48" y="422" fill="#cdd6f4" font-size="9">kernel rejects if maj != kernel.maj</text>
    <text x="48" y="434" fill="#cdd6f4" font-size="9">or min &gt; kernel.min  (see docs/contracts/abi-evolution.en.md)</text>

    <rect x="36" y="456" width="496" height="56" rx="6"
          fill="#45475a" stroke="#94e2d5" stroke-width="1.5"/>
    <text x="48" y="476" fill="#94e2d5" font-size="10" font-weight="bold">4.  gn_plugin_descriptor()  (optional)</text>
    <text x="48" y="492" fill="#cdd6f4" font-size="9">name, version, kind, ext_requires / ext_provides</text>
    <text x="48" y="504" fill="#cdd6f4" font-size="9">drives extension dependency ordering across plugins</text>

    <rect x="36" y="526" width="496" height="56" rx="6"
          fill="#45475a" stroke="#fab387" stroke-width="1.5"/>
    <text x="48" y="546" fill="#fab387" font-size="10" font-weight="bold">5.  gn_plugin_init(host_api, ctx, &amp;out_self)</text>
    <text x="48" y="562" fill="#cdd6f4" font-size="9">phase "install" — construct internal state, allocate buffers</text>
    <text x="48" y="574" fill="#cdd6f4" font-size="9">MUST NOT call host_api-&gt;register_vtable yet (lifecycle.en.md §3d)</text>

    <rect x="36" y="596" width="496" height="56" rx="6"
          fill="#45475a" stroke="#f9e2af" stroke-width="1.5"/>
    <text x="48" y="616" fill="#f9e2af" font-size="10" font-weight="bold">6.  gn_plugin_register(self)</text>
    <text x="48" y="632" fill="#cdd6f4" font-size="9">phase "start" — atomic with siblings (two-phase activation)</text>
    <text x="48" y="644" fill="#cdd6f4" font-size="9">host_api-&gt;register_vtable(KIND, …) / register_security / register_extension</text>

    <rect x="36" y="666" width="496" height="56" rx="6"
          fill="#45475a" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="48" y="686" fill="#a6e3a1" font-size="10" font-weight="bold">7.  Running</text>
    <text x="48" y="702" fill="#cdd6f4" font-size="9">dispatch open; plugin live; vtable thunks called from kernel threads</text>
    <text x="48" y="714" fill="#cdd6f4" font-size="9">handler-&gt;handle_message, link-&gt;connect, security-&gt;handshake_step …</text>
  </g>

  <!-- ═══ Teardown phases (column) ═══ -->
  <g>
    <text x="552" y="232" fill="#f38ba8" font-size="11" font-weight="bold">Teardown  —  phases 8 → 11 (reverse of start-up)</text>

    <rect x="552" y="246" width="496" height="56" rx="6"
          fill="#45475a" stroke="#f9e2af" stroke-width="1.5"/>
    <text x="564" y="266" fill="#f9e2af" font-size="10" font-weight="bold">8.  PreShutdown</text>
    <text x="564" y="282" fill="#cdd6f4" font-size="9">publish shutdown_requested via host_api-&gt;is_shutdown_requested()</text>
    <text x="564" y="294" fill="#cdd6f4" font-size="9">drain in-flight dispatches; new ones rejected at entry</text>

    <rect x="552" y="316" width="496" height="56" rx="6"
          fill="#45475a" stroke="#fab387" stroke-width="1.5"/>
    <text x="564" y="336" fill="#fab387" font-size="10" font-weight="bold">9.  gn_plugin_unregister(self)</text>
    <text x="564" y="352" fill="#cdd6f4" font-size="9">registry entries drop anchors; cooperative</text>
    <text x="564" y="364" fill="#cdd6f4" font-size="9">no further dispatch into this plugin's vtables</text>

    <rect x="552" y="386" width="496" height="56" rx="6"
          fill="#45475a" stroke="#cba6f7" stroke-width="1.5"/>
    <text x="564" y="406" fill="#cba6f7" font-size="10" font-weight="bold">10. Quiescence wait</text>
    <text x="564" y="422" fill="#cdd6f4" font-size="9">weak-observer waits for the sentinel to expire (default 1 s)</text>
    <text x="564" y="434" fill="#cdd6f4" font-size="9">guarantees no in-flight callback can race shutdown</text>

    <rect x="552" y="456" width="496" height="56" rx="6"
          fill="#45475a" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="564" y="476" fill="#f38ba8" font-size="10" font-weight="bold">11. gn_plugin_shutdown(self)</text>
    <text x="564" y="492" fill="#cdd6f4" font-size="9">phase "destroy" — release internal state, join workers</text>
    <text x="564" y="504" fill="#cdd6f4" font-size="9">six-step ordering from lifecycle.en.md §4 (cancel → close → join → notify → free)</text>

    <rect x="552" y="526" width="496" height="56" rx="6"
          fill="#45475a" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="564" y="546" fill="#f38ba8" font-size="10" font-weight="bold">12. runtime-&gt;close()</text>
    <text x="564" y="562" fill="#cdd6f4" font-size="9">dynamic: dlclose(handle); wasm-plugin: drop WASM instance</text>
    <text x="564" y="574" fill="#cdd6f4" font-size="9">static: noop; remote: notify peer + tear down channel</text>

    <rect x="552" y="596" width="496" height="56" rx="6"
          fill="#181825" stroke="#585b70" stroke-width="1.2"/>
    <text x="564" y="616" fill="#585b70" font-size="10" font-weight="bold">Drain timeout</text>
    <text x="564" y="632" fill="#cdd6f4" font-size="9">if quiescence wait expires with sentinel non-zero,</text>
    <text x="564" y="644" fill="#cdd6f4" font-size="9">leak the handle (better than crash on dangling callback)</text>

    <rect x="552" y="666" width="496" height="56" rx="6"
          fill="#181825" stroke="#585b70" stroke-width="1.2"/>
    <text x="564" y="686" fill="#585b70" font-size="10" font-weight="bold">Two-phase activation (phases 5–6)</text>
    <text x="564" y="702" fill="#cdd6f4" font-size="9">every plugin runs phase 5 before any runs phase 6.</text>
    <text x="564" y="714" fill="#cdd6f4" font-size="9">partial init failure → rollback (call shutdown without register).</text>
  </g>

  <!-- IPluginRuntime row at the bottom -->
  <g>
    <rect x="36" y="744" width="1012" height="320" rx="6"
          fill="#181825" stroke="#cba6f7" stroke-width="1.5"/>
    <text x="48" y="766" fill="#cba6f7" font-size="12" font-weight="bold">IPluginRuntime  —  the four kinds</text>

    <rect x="60" y="784" width="232" height="270" rx="6"
          fill="#45475a" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="72" y="806" fill="#a6e3a1" font-size="11" font-weight="bold">"static"</text>
    <text x="72" y="826" fill="#cdd6f4" font-size="9">core/plugin/runtimes/static.cpp</text>
    <text x="72" y="844" fill="#cdd6f4" font-size="9">  · linked into goodnet binary</text>
    <text x="72" y="860" fill="#cdd6f4" font-size="9">  · load() = lookup in static registry</text>
    <text x="72" y="876" fill="#cdd6f4" font-size="9">  · close() = noop</text>
    <text x="72" y="894" fill="#cdd6f4" font-size="9">  · used by build-static target</text>
    <text x="72" y="912" fill="#cdd6f4" font-size="9">  · entry symbols suffix-renamed:</text>
    <text x="72" y="926" fill="#cdd6f4" font-size="9">      gn_plugin_init_link_tcp, …</text>
    <text x="72" y="944" fill="#a6e3a1" font-size="9">  status: GREEN (built-in)</text>
    <text x="72" y="978" fill="#585b70" font-size="9">use case:</text>
    <text x="72" y="994" fill="#585b70" font-size="9">  single Release binary,</text>
    <text x="72" y="1010" fill="#585b70" font-size="9">  embedded systems, Android</text>

    <rect x="312" y="784" width="232" height="270" rx="6"
          fill="#45475a" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="324" y="806" fill="#89b4fa" font-size="11" font-weight="bold">"dynamic"</text>
    <text x="324" y="826" fill="#cdd6f4" font-size="9">core/plugin/runtimes/dynamic.cpp</text>
    <text x="324" y="844" fill="#cdd6f4" font-size="9">  · POSIX dlopen / Windows LoadLibrary</text>
    <text x="324" y="860" fill="#cdd6f4" font-size="9">  · resolves 5 mandatory entry symbols</text>
    <text x="324" y="876" fill="#cdd6f4" font-size="9">    via dlsym</text>
    <text x="324" y="894" fill="#cdd6f4" font-size="9">  · close() = dlclose</text>
    <text x="324" y="912" fill="#cdd6f4" font-size="9">  · leak-on-timeout policy if drain fails</text>
    <text x="324" y="930" fill="#cdd6f4" font-size="9">  · default for goodnetd packaged build</text>
    <text x="324" y="944" fill="#89b4fa" font-size="9">  status: GREEN (built-in)</text>
    <text x="324" y="978" fill="#585b70" font-size="9">use case:</text>
    <text x="324" y="994" fill="#585b70" font-size="9">  hot-reload, per-plugin updates,</text>
    <text x="324" y="1010" fill="#585b70" font-size="9">  separate .so per plugin</text>

    <rect x="564" y="784" width="232" height="270" rx="6"
          fill="#45475a" stroke="#94e2d5" stroke-width="1.5"/>
    <text x="576" y="806" fill="#94e2d5" font-size="11" font-weight="bold">"remote"</text>
    <text x="576" y="826" fill="#cdd6f4" font-size="9">core/plugin/runtimes/remote.cpp</text>
    <text x="576" y="844" fill="#cdd6f4" font-size="9">  · plugin runs in a separate process</text>
    <text x="576" y="860" fill="#cdd6f4" font-size="9">    or on a remote host</text>
    <text x="576" y="876" fill="#cdd6f4" font-size="9">  · all 5 entry symbols routed</text>
    <text x="576" y="894" fill="#cdd6f4" font-size="9">    over sdk/remote framed wire</text>
    <text x="576" y="912" fill="#cdd6f4" font-size="9">  · close() = tear down channel</text>
    <text x="576" y="930" fill="#cdd6f4" font-size="9">  · dev-mode only; security boundary</text>
    <text x="576" y="944" fill="#94e2d5" font-size="9">  status: GREEN (built-in, dev-only)</text>
    <text x="576" y="978" fill="#585b70" font-size="9">use case:</text>
    <text x="576" y="994" fill="#585b70" font-size="9">  language-experimentation,</text>
    <text x="576" y="1010" fill="#585b70" font-size="9">  fault isolation while iterating</text>

    <rect x="816" y="784" width="232" height="270" rx="6"
          fill="#45475a" stroke="#f9e2af" stroke-width="1.5"
          stroke-dasharray="6,3"/>
    <text x="828" y="806" fill="#f9e2af" font-size="11" font-weight="bold">"wasm-plugin"</text>
    <text x="828" y="826" fill="#cdd6f4" font-size="9">registered via sdk/plugin_runtime.h</text>
    <text x="828" y="844" fill="#cdd6f4" font-size="9">  · host implements C vtable</text>
    <text x="828" y="860" fill="#cdd6f4" font-size="9">  · wasmtime / wasmer / browser WASM</text>
    <text x="828" y="876" fill="#cdd6f4" font-size="9">  · load() = instantiate module</text>
    <text x="828" y="894" fill="#cdd6f4" font-size="9">  · close() = drop instance</text>
    <text x="828" y="912" fill="#cdd6f4" font-size="9">  · same dispatch as built-in kinds</text>
    <text x="828" y="930" fill="#cdd6f4" font-size="9">  · powers web-node JS handlers</text>
    <text x="828" y="944" fill="#f9e2af" font-size="9">  status: YELLOW (coming)</text>
    <text x="828" y="978" fill="#585b70" font-size="9">use case:</text>
    <text x="828" y="994" fill="#585b70" font-size="9">  browser tabs, sandboxed</text>
    <text x="828" y="1010" fill="#585b70" font-size="9">  3rd-party plugins, eBPF later</text>
  </g>

  <!-- Arrows: runtime selector → phase 1 -->
  <path d="M 540 200 L 540 230" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>

  <!-- Arrows down the left column -->
  <path d="M 284 302 L 284 316" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 284 372 L 284 386" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 284 442 L 284 456" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 284 512 L 284 526" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 284 582 L 284 596" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 284 652 L 284 666" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>

  <!-- Crossover: phase 7 (running) → phase 8 (PreShutdown) -->
  <path d="M 532 694 L 552 274" stroke="#fab387" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <text x="540" y="490" fill="#fab387" font-size="9">shutdown signal</text>

  <!-- Arrows down the right column -->
  <path d="M 800 302 L 800 316" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 800 372 L 800 386" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 800 442 L 800 456" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 800 512 L 800 526" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 800 582 L 800 596" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>

  <!-- Arrows: phase 12 / phase 2 → runtime row -->
  <path d="M 800 582 L 800 744" stroke="#cba6f7" stroke-width="1.2"
        fill="none" marker-end="url(#arr)" stroke-dasharray="4,3"/>
  <text x="808" y="700" fill="#cba6f7" font-size="9">runtime-&gt;close</text>
  <path d="M 284 372 L 200 744" stroke="#cba6f7" stroke-width="1.2"
        fill="none" marker-end="url(#arr)" stroke-dasharray="4,3"/>
  <text x="208" y="600" fill="#cba6f7" font-size="9">runtime-&gt;load</text>

</svg>
