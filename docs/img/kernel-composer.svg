<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  kernel-composer.svg — kernel = registry + composer (zero transport).
  Plugin slots (links / security / handlers / protocols / strategies).
  Plugin runtimes: static, dynamic, remote, wasm-plugin (4th).
  Extension surface namespaces: gn.handler.*, gn.security.*,
  gn.identity.*, gn.link.*.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780"
     viewBox="0 0 1180 780" font-family="JetBrains Mono,Fira Code,monospace">
  <title>Kernel composer pattern</title>
  <desc>Registry + composer core, five plugin slot families, four
        plugin runtimes (three built-in + wasm-plugin), and the
        gn.* extension surface.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#585b70"/>
    </marker>
  </defs>

  <rect width="1180" height="780" fill="#1e1e2e"/>

  <text x="24" y="36" fill="#cdd6f4" font-size="15" font-weight="bold">
    Kernel composer  —  registry + composer, no transport knowledge
  </text>
  <text x="24" y="56" fill="#585b70" font-size="11">
    Kernel doesn't speak TCP, QUIC, or Noise. It composes vtables that plugins register, and routes by conn-id / handler-id / extension-name.
  </text>

  <!-- ═══ Centre: Kernel ═══ -->
  <g>
    <rect x="384" y="96" width="412" height="200" rx="8"
          fill="#181825" stroke="#b4befe" stroke-width="1.8"/>
    <text x="400" y="120" fill="#b4befe" font-size="13" font-weight="bold">
      Kernel  (core/)
    </text>
    <text x="400" y="138" fill="#585b70" font-size="10">opaque C++ implementation behind sdk/core.h</text>

    <rect x="404" y="152" width="180" height="56" rx="6"
          fill="#45475a" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="416" y="172" fill="#a6e3a1" font-size="11" font-weight="bold">Registry</text>
    <text x="416" y="188" fill="#cdd6f4" font-size="9">core/registry/*</text>
    <text x="416" y="200" fill="#cdd6f4" font-size="9">sharded by conn / pk / id</text>

    <rect x="596" y="152" width="180" height="56" rx="6"
          fill="#45475a" stroke="#cba6f7" stroke-width="1.5"/>
    <text x="608" y="172" fill="#cba6f7" font-size="11" font-weight="bold">Composer</text>
    <text x="608" y="188" fill="#cdd6f4" font-size="9">core/composer/*</text>
    <text x="608" y="200" fill="#cdd6f4" font-size="9">conn-id bit-63 dispatch</text>

    <rect x="404" y="220" width="372" height="64" rx="6"
          fill="#45475a" stroke="#fab387" stroke-width="1.5"/>
    <text x="416" y="240" fill="#fab387" font-size="11" font-weight="bold">host_api_t  (41 named slots + 8 reserved)</text>
    <text x="416" y="256" fill="#cdd6f4" font-size="9">register_vtable, register_security, register_extension,</text>
    <text x="416" y="270" fill="#cdd6f4" font-size="9">send, subscribe_*, set_timer, find_conn_by_pk, …</text>
  </g>

  <!-- ═══ Plugin slot families (left column) ═══ -->
  <g>
    <text x="36" y="100" fill="#94e2d5" font-size="11" font-weight="bold">Plugin slots — registered via host_api</text>

    <rect x="36" y="116" width="320" height="48" rx="6"
          fill="#45475a" stroke="#89b4fa" stroke-width="1.2"/>
    <text x="48" y="136" fill="#89b4fa" font-size="10" font-weight="bold">gn_link_vtable_s</text>
    <text x="48" y="152" fill="#cdd6f4" font-size="9">plugins/links/*  · scheme, listen, connect, send, …</text>

    <rect x="36" y="172" width="320" height="48" rx="6"
          fill="#45475a" stroke="#cba6f7" stroke-width="1.2"/>
    <text x="48" y="192" fill="#cba6f7" font-size="10" font-weight="bold">gn_security_provider_vtable_s</text>
    <text x="48" y="208" fill="#cdd6f4" font-size="9">plugins/security/*  · handshake_open, handshake_step, …</text>

    <rect x="36" y="228" width="320" height="48" rx="6"
          fill="#45475a" stroke="#a6e3a1" stroke-width="1.2"/>
    <text x="48" y="248" fill="#a6e3a1" font-size="10" font-weight="bold">gn_handler_vtable_s</text>
    <text x="48" y="264" fill="#cdd6f4" font-size="9">plugins/handlers/*  · protocol_id, handle_message, on_result</text>

    <rect x="36" y="284" width="320" height="48" rx="6"
          fill="#45475a" stroke="#f9e2af" stroke-width="1.2"/>
    <text x="48" y="304" fill="#f9e2af" font-size="10" font-weight="bold">gn_protocol_layer_s</text>
    <text x="48" y="320" fill="#cdd6f4" font-size="9">plugins/protocols/*  · encode, decode, frame layering</text>

    <rect x="36" y="340" width="320" height="48" rx="6"
          fill="#45475a" stroke="#fab387" stroke-width="1.2"/>
    <text x="48" y="360" fill="#fab387" font-size="10" font-weight="bold">gn_strategy_vtable_s</text>
    <text x="48" y="376" fill="#cdd6f4" font-size="9">plugins/strategies/*  · path selection, send-rtt floats</text>

    <text x="36" y="410" fill="#585b70" font-size="9">Five families = five vtable types. Kernel doesn't know what's inside; it routes by id.</text>
  </g>

  <!-- ═══ Plugin runtimes (right column) ═══ -->
  <g>
    <text x="824" y="100" fill="#fab387" font-size="11" font-weight="bold">Plugin runtimes — register kind once via sdk/core.h</text>

    <rect x="824" y="116" width="320" height="48" rx="6"
          fill="#45475a" stroke="#a6e3a1" stroke-width="1.2"/>
    <text x="836" y="136" fill="#a6e3a1" font-size="10" font-weight="bold">static  (built-in)</text>
    <text x="836" y="152" fill="#cdd6f4" font-size="9">linked into goodnet binary; load_static() iterates registry</text>

    <rect x="824" y="172" width="320" height="48" rx="6"
          fill="#45475a" stroke="#a6e3a1" stroke-width="1.2"/>
    <text x="836" y="192" fill="#a6e3a1" font-size="10" font-weight="bold">dynamic  (built-in)</text>
    <text x="836" y="208" fill="#cdd6f4" font-size="9">dlopen(.so, LAZY|LOCAL); five mandatory entry symbols</text>

    <rect x="824" y="228" width="320" height="48" rx="6"
          fill="#45475a" stroke="#a6e3a1" stroke-width="1.2"/>
    <text x="836" y="248" fill="#a6e3a1" font-size="10" font-weight="bold">remote  (built-in)</text>
    <text x="836" y="264" fill="#cdd6f4" font-size="9">plugin on the other end of a wire (sdk/remote, dev-only)</text>

    <rect x="824" y="284" width="320" height="48" rx="6"
          fill="#45475a" stroke="#f9e2af" stroke-width="1.5"
          stroke-dasharray="6,3"/>
    <text x="836" y="304" fill="#f9e2af" font-size="10" font-weight="bold">wasm-plugin  (4th, coming)</text>
    <text x="836" y="320" fill="#cdd6f4" font-size="9">register via sdk/plugin_runtime.h; same dispatch path</text>

    <text x="824" y="346" fill="#585b70" font-size="9">Runtimes are interchangeable: same PluginManager::open_one path</text>
    <text x="824" y="360" fill="#585b70" font-size="9">→ runtime-&gt;load → init → register → unregister → close.</text>
    <text x="824" y="378" fill="#585b70" font-size="9">Custom runtimes (jvm-bridge, ebpf) layer without touching the kernel.</text>
  </g>

  <!-- ═══ Extension surface (bottom row) ═══ -->
  <g>
    <text x="36" y="450" fill="#f9e2af" font-size="11" font-weight="bold">Extension surface  —  gn.* names exposed via host_api-&gt;register_extension</text>

    <rect x="36" y="468" width="272" height="120" rx="6"
          fill="#45475a" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="48" y="490" fill="#a6e3a1" font-size="11" font-weight="bold">gn.handler.*</text>
    <text x="48" y="510" fill="#cdd6f4" font-size="9">gn.handler.store</text>
    <text x="48" y="524" fill="#cdd6f4" font-size="9">gn.handler.dns</text>
    <text x="48" y="538" fill="#cdd6f4" font-size="9">gn.handler.heartbeat</text>
    <text x="48" y="552" fill="#cdd6f4" font-size="9">gn.handler.audit</text>
    <text x="48" y="566" fill="#cdd6f4" font-size="9">gn.handler.forwarding · gn.handler.sftp-modern</text>
    <text x="48" y="580" fill="#585b70" font-size="9">queried by other plugins via query_extension_checked</text>

    <rect x="324" y="468" width="272" height="120" rx="6"
          fill="#45475a" stroke="#cba6f7" stroke-width="1.5"/>
    <text x="336" y="490" fill="#cba6f7" font-size="11" font-weight="bold">gn.security.*</text>
    <text x="336" y="510" fill="#cdd6f4" font-size="9">gn.security.noise</text>
    <text x="336" y="524" fill="#cdd6f4" font-size="9">gn.security.pkcs11  (dual-exposed)</text>
    <text x="336" y="538" fill="#cdd6f4" font-size="9">gn.security.null  (dev/test)</text>
    <text x="336" y="566" fill="#585b70" font-size="9">handshake state machines + provider_id</text>
    <text x="336" y="580" fill="#585b70" font-size="9">drop-in selectable per connection</text>

    <rect x="612" y="468" width="272" height="120" rx="6"
          fill="#45475a" stroke="#94e2d5" stroke-width="1.5"/>
    <text x="624" y="490" fill="#94e2d5" font-size="11" font-weight="bold">gn.identity.*</text>
    <text x="624" y="510" fill="#cdd6f4" font-size="9">gn.identity.local  (in-memory, plain file)</text>
    <text x="624" y="524" fill="#cdd6f4" font-size="9">gn.identity.pkcs11  (same .so as security)</text>
    <text x="624" y="538" fill="#f9e2af" font-size="9">gn.identity.tpm  (future)</text>
    <text x="624" y="552" fill="#f9e2af" font-size="9">gn.identity.keychain · gn.identity.webauthn  (future)</text>
    <text x="624" y="572" fill="#585b70" font-size="9">added by Phase 1–5 (see identity-hsm-flow.svg)</text>

    <rect x="900" y="468" width="244" height="120" rx="6"
          fill="#45475a" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="912" y="490" fill="#89b4fa" font-size="11" font-weight="bold">gn.link.*</text>
    <text x="912" y="510" fill="#cdd6f4" font-size="9">gn.link.tcp · gn.link.udp</text>
    <text x="912" y="524" fill="#cdd6f4" font-size="9">gn.link.ws · gn.link.tls</text>
    <text x="912" y="538" fill="#cdd6f4" font-size="9">gn.link.quic · gn.link.ipc</text>
    <text x="912" y="552" fill="#cdd6f4" font-size="9">gn.link.ice</text>
    <text x="912" y="576" fill="#585b70" font-size="9">scheme → carrier mapping</text>
  </g>

  <!-- ═══ Bottom note ═══ -->
  <g>
    <rect x="36" y="610" width="1108" height="150" rx="6"
          fill="#181825" stroke="#585b70" stroke-width="1.2"/>
    <text x="48" y="630" fill="#585b70" font-size="11" font-weight="bold">Why "composer" rather than "orchestrator"?</text>
    <text x="48" y="650" fill="#cdd6f4" font-size="10">  · An orchestrator owns a topology and tells parts what to do; a composer owns a registry and lets parts compose at the seams.</text>
    <text x="48" y="666" fill="#cdd6f4" font-size="10">  · Kernel never opens a socket, never calls a hash, never picks a path. It is given vtables that do these things and routes by ID.</text>
    <text x="48" y="682" fill="#cdd6f4" font-size="10">  · Adding new families = adding new vtable shape + register helper. Adding new runtimes = registering a fourth/fifth kind.</text>
    <text x="48" y="698" fill="#cdd6f4" font-size="10">  · Same dispatch path serves built-in static plugins (release binary), dlopen .so plugins, remote dev-mode plugins, and wasm-plugin runtimes.</text>
    <text x="48" y="714" fill="#cdd6f4" font-size="10">  · Extensions (gn.*) are looked up by name + version; they are how plugins talk to each other without depending on each other's headers.</text>
    <text x="48" y="730" fill="#cdd6f4" font-size="10">  · Result: kernel binary is ~MB, has zero protocol code, and never changes when a new link / handler / security family lands.</text>
    <text x="48" y="746" fill="#cdd6f4" font-size="10">  · See also: composer_extension.svg (bit-63 dispatch), handler_kinds.svg (the four vtable shapes), dlopen_pipeline.svg (runtime).</text>
  </g>

  <!-- Arrows: slots → kernel registry -->
  <path d="M 356 140 L 384 174" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 356 196 L 384 184" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 356 252 L 384 196" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 356 308 L 384 220" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 356 364 L 384 252" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>

  <!-- Arrows: kernel → runtimes (kernel loads via runtime) -->
  <path d="M 796 140 L 824 140" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 796 168 L 824 196" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 796 196 L 824 252" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 796 224 L 824 308" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>

  <!-- Arrows: kernel host_api → extension namespaces -->
  <path d="M 590 296 L 590 468" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>

</svg>
