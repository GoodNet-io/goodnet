<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  ssh-modern-dual-wire.svg — gssh listener serves two wire shapes off
  a single TCP :22 socket. The decision point is the SSH ext-info
  exchange (RFC 8308): if the client advertises gn-version, gssh
  switches into the goodnet handler-ext channel; otherwise it
  delegates to libssh as a vanilla SSH-2.0 server.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760"
     viewBox="0 0 1180 760" font-family="JetBrains Mono,Fira Code,monospace">
  <title>ssh-modern dual-wire dispatch</title>
  <desc>Single TCP :22 listener splits into native openssh shell
        branch and goodnet handler-ext TLV branch at SSH ext-info.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#585b70"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a6e3a1"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#89b4fa"/>
    </marker>
  </defs>

  <rect width="1180" height="760" fill="#1e1e2e"/>

  <text x="24" y="36" fill="#cdd6f4" font-size="15" font-weight="bold">
    ssh-modern — dual-wire on a single TCP :22 socket
  </text>
  <text x="24" y="56" fill="#585b70" font-size="11">
    Branch A: vanilla SSH-2.0 (native openssh client, PTY shell).
    Branch B: SSH-2.0 + gn-version ext-info → handler-ext TLV channel (forwarding, sftp, …).
  </text>

  <!-- Listener -->
  <g>
    <rect x="464" y="92" width="252" height="80" rx="6"
          fill="#45475a" stroke="#b4befe" stroke-width="1.5"/>
    <text x="476" y="114" fill="#b4befe" font-size="11" font-weight="bold">gssh listener</text>
    <text x="476" y="132" fill="#cdd6f4" font-size="10">apps/gssh/server.cpp</text>
    <text x="476" y="148" fill="#cdd6f4" font-size="10">bind(0.0.0.0:22) / [::]:22</text>
    <text x="476" y="164" fill="#cdd6f4" font-size="10">accept loop → spawn per-conn task</text>
  </g>

  <!-- Pre-decision: SSH KEX + ext-info -->
  <g>
    <rect x="384" y="206" width="412" height="84" rx="6"
          fill="#45475a" stroke="#cba6f7" stroke-width="1.5"/>
    <text x="396" y="228" fill="#cba6f7" font-size="11" font-weight="bold">SSH-2.0 KEX + ext-info (RFC 8308)</text>
    <text x="396" y="246" fill="#cdd6f4" font-size="10">  1. version exchange  "SSH-2.0-gssh_1.0"  /  "SSH-2.0-OpenSSH_9.6"</text>
    <text x="396" y="262" fill="#cdd6f4" font-size="10">  2. KEXINIT  →  curve25519-sha256, chacha20-poly1305@openssh.com, …</text>
    <text x="396" y="278" fill="#cdd6f4" font-size="10">  3. SSH_MSG_EXT_INFO  →  client advertises  gn-version=1  ?</text>
  </g>

  <!-- Decision diamond -->
  <g>
    <polygon points="590,316 720,376 590,436 460,376"
             fill="#45475a" stroke="#f9e2af" stroke-width="1.5"/>
    <text x="590" y="370" fill="#f9e2af" font-size="11" font-weight="bold"
          text-anchor="middle">ext-info?</text>
    <text x="590" y="386" fill="#cdd6f4" font-size="10"
          text-anchor="middle">gn-version present?</text>
  </g>

  <text x="412" y="376" fill="#a6e3a1" font-size="10">no  →  branch A</text>
  <text x="722" y="376" fill="#89b4fa" font-size="10">yes  →  branch B</text>

  <!-- ════ Branch A — native openssh ════ -->
  <g>
    <rect x="48" y="466" width="468" height="244" rx="6"
          fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="60" y="488" fill="#a6e3a1" font-size="12" font-weight="bold">
      Branch A — native openssh client
    </text>
    <text x="60" y="506" fill="#585b70" font-size="10">unmodified ssh / scp / rsync over OpenSSH-compatible wire</text>

    <rect x="72" y="524" width="420" height="56" rx="6"
          fill="#45475a" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="84" y="544" fill="#a6e3a1" font-size="10" font-weight="bold">libssh server (vendored)</text>
    <text x="84" y="560" fill="#cdd6f4" font-size="9">authenticates pubkey via plugins/security/ssh (RFC 4252)</text>
    <text x="84" y="574" fill="#cdd6f4" font-size="9">channel-open session → request-pty → request-shell</text>

    <rect x="72" y="592" width="200" height="68" rx="6"
          fill="#45475a" stroke="#fab387" stroke-width="1.5"/>
    <text x="84" y="610" fill="#fab387" font-size="10" font-weight="bold">PTY + shell</text>
    <text x="84" y="626" fill="#cdd6f4" font-size="9">fork + execve(login shell)</text>
    <text x="84" y="640" fill="#cdd6f4" font-size="9">forwardX11, sftp-subsystem,</text>
    <text x="84" y="654" fill="#cdd6f4" font-size="9">exec-direct — all libssh-native</text>

    <rect x="288" y="592" width="204" height="68" rx="6"
          fill="#45475a" stroke="#94e2d5" stroke-width="1.5"/>
    <text x="300" y="610" fill="#94e2d5" font-size="10" font-weight="bold">audit + accounting</text>
    <text x="300" y="626" fill="#cdd6f4" font-size="9">login event → gn.handler.audit</text>
    <text x="300" y="640" fill="#cdd6f4" font-size="9">utmp / wtmp, pam_session</text>
    <text x="300" y="654" fill="#cdd6f4" font-size="9">syslog AUTH facility</text>

    <text x="60" y="690" fill="#585b70" font-size="9">guarantee: native ssh works against gssh just like sshd; no gn-version, no goodnet semantics.</text>
  </g>

  <!-- ════ Branch B — goodnet handler-ext ════ -->
  <g>
    <rect x="664" y="466" width="492" height="244" rx="6"
          fill="#181825" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="676" y="488" fill="#89b4fa" font-size="12" font-weight="bold">
      Branch B — gssh client, handler-ext channel
    </text>
    <text x="676" y="506" fill="#585b70" font-size="10">SSH frames transport identity / KEX; payloads are goodnet handlers</text>

    <rect x="688" y="524" width="456" height="56" rx="6"
          fill="#45475a" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="700" y="544" fill="#89b4fa" font-size="10" font-weight="bold">channel: gn.handler-ext</text>
    <text x="700" y="560" fill="#cdd6f4" font-size="9">SSH_MSG_CHANNEL_OPEN "gn.handler-ext"; subtype field selects handler</text>
    <text x="700" y="574" fill="#cdd6f4" font-size="9">peer pubkey == SSH user-key; identity shared with rest of kernel</text>

    <rect x="688" y="592" width="216" height="68" rx="6"
          fill="#45475a" stroke="#fab387" stroke-width="1.5"/>
    <text x="700" y="610" fill="#fab387" font-size="10" font-weight="bold">TLV envelope per frame</text>
    <text x="700" y="626" fill="#cdd6f4" font-size="9">  · proto u16 (handler id)</text>
    <text x="700" y="640" fill="#cdd6f4" font-size="9">  · msg u16 / payload</text>
    <text x="700" y="654" fill="#cdd6f4" font-size="9">  · framed over SSH data window</text>

    <rect x="920" y="592" width="224" height="68" rx="6"
          fill="#45475a" stroke="#94e2d5" stroke-width="1.5"/>
    <text x="932" y="610" fill="#94e2d5" font-size="10" font-weight="bold">routed handlers</text>
    <text x="932" y="626" fill="#cdd6f4" font-size="9">  · gn.handler.forwarding</text>
    <text x="932" y="640" fill="#cdd6f4" font-size="9">  · gn.handler.sftp-modern</text>
    <text x="932" y="654" fill="#cdd6f4" font-size="9">  · gn.handler.shell-modern</text>

    <text x="676" y="690" fill="#585b70" font-size="9">guarantee: a gssh peer keeps SSH on the wire (firewall-friendly) but speaks goodnet semantics inside.</text>
  </g>

  <!-- Arrows: listener → KEX → diamond -->
  <path d="M 590 172 L 590 206" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>
  <path d="M 590 290 L 590 316" stroke="#585b70" stroke-width="1.2"
        fill="none" marker-end="url(#arr)"/>

  <!-- Decision → branches -->
  <path d="M 460 376 L 282 466" stroke="#a6e3a1" stroke-width="1.5"
        fill="none" marker-end="url(#arrG)"/>
  <path d="M 720 376 L 910 466" stroke="#89b4fa" stroke-width="1.5"
        fill="none" marker-end="url(#arrB)"/>

  <!-- Note at the bottom -->
  <g>
    <rect x="48" y="722" width="1108" height="28" rx="4"
          fill="#181825" stroke="#585b70" stroke-width="1.0"/>
    <text x="60" y="742" fill="#585b70" font-size="10">
      Both branches share TCP :22 socket, KEX, host-key, and ssh user-cert checks. Decision is the first frame after KEX_INIT — cheap and reversible per session.
    </text>
  </g>

  <!-- Legend -->
  <g transform="translate(900,40)">
    <rect x="0" y="-12" width="14" height="14" fill="#a6e3a1"/>
    <text x="18" y="-1" fill="#cdd6f4" font-size="10">native ssh</text>
    <rect x="90" y="-12" width="14" height="14" fill="#89b4fa"/>
    <text x="108" y="-1" fill="#cdd6f4" font-size="10">handler-ext</text>
    <rect x="200" y="-12" width="14" height="14" fill="#f9e2af"/>
    <text x="218" y="-1" fill="#cdd6f4" font-size="10">decision</text>
  </g>
</svg>
