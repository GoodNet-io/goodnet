# Server-reflexive ICE topology.
#
# Two peers, each behind its own full-cone NAT, with a STUN server
# on the "Internet" subnet. Host candidates are useless across the
# two LANs (private 10.20.0.0/24 vs 10.30.0.0/24); the working
# nominated pair is srflx ↔ srflx after the STUN bindings come back.
# TURN is *not* allocated — the scenario keeps the TURN list empty
# so a gathering failure or a slow relay can't mask a working srflx
# path.
#
# Pass criterion: both reports nominated=true, uses_relay=false,
# local_type ∈ {srflx, prflx}, remote_type ∈ {srflx, prflx}. Host
# candidates do gather (they're the LAN IPs) but they fail the
# connectivity check and aren't picked.
#
# Subnets are offset by +1 from ../ice-3node/docker-compose.yml
# (10.41.x / 10.21.x / 10.31.x) so this stack can coexist with the
# 3-node stack on the same docker daemon. The NAT init script
# accepts LAN_SUBNET / WAN_SUBNET env overrides (see
# ../ice-3node/nat-a/init-nat.sh) — pass them explicitly per-NAT.
#
# Peer image / harness binary / plugin .so set are shared with
# ../ice-3node/peer/ (the runner stages them up-front via
# build-harness.sh, same shape as ice-host).

services:
  stun:
    build:
      context: ../ice-3node/stun
      network: host
    container_name: icesrflx_stun
    networks:
      net: { ipv4_address: 10.41.0.10 }
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -uz 127.0.0.1 3478"]
      interval: 2s
      retries: 10

  coordinator:
    build:
      context: ../ice-3node/peer
      network: host
    container_name: icesrflx_coordinator
    networks:
      net: { ipv4_address: 10.41.0.12 }
    environment:
      ROLE: coordinator
    volumes:
      - signal:/var/lib/ice3-signal

  nat_a:
    build:
      context: ../ice-3node/nat-a
      network: host
    container_name: icesrflx_nat_a
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.rp_filter: 0
      net.ipv4.conf.default.rp_filter: 0
      net.ipv6.conf.all.forwarding: 1
    networks:
      lan_a: { ipv4_address: 10.21.0.1 }
      net:   { ipv4_address: 10.41.0.20 }
    environment:
      NAT_MODE:     full_cone
      LAN_SUBNET:   10.21.0.0/24
      WAN_SUBNET:   10.41.0.0/24
      # Block direct LAN-to-LAN UDP. Docker installs a permissive
      # host FORWARD chain by default, so peer A could otherwise
      # reach peer B's host candidate directly through the host
      # bridge (host_a ↔ host_b). The srflx test must force the
      # only working path to be via the NAT WAN IP, otherwise the
      # nominated pair leaks "host" and the scenario claim is a
      # lie. The block applies to peer A's outbound destined to
      # peer B's LAN — the matching destinations on peer A's srflx
      # path (10.41.0.30 = nat_b WAN) are untouched.
      BLOCK_UDP_TO: 10.31.0.0/24
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/nat-ready"]
      interval: 1s
      timeout: 3s
      retries: 15
      start_period: 0s

  nat_b:
    build:
      context: ../ice-3node/nat-a
      network: host
    container_name: icesrflx_nat_b
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.rp_filter: 0
      net.ipv4.conf.default.rp_filter: 0
      net.ipv6.conf.all.forwarding: 1
    networks:
      lan_b: { ipv4_address: 10.31.0.1 }
      net:   { ipv4_address: 10.41.0.30 }
    environment:
      NAT_MODE:     full_cone
      LAN_SUBNET:   10.31.0.0/24
      WAN_SUBNET:   10.41.0.0/24
      BLOCK_UDP_TO: 10.21.0.0/24
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/nat-ready"]
      interval: 1s
      timeout: 3s
      retries: 15
      start_period: 0s

  peer_a:
    build:
      context: ../ice-3node/peer
      network: host
    container_name: icesrflx_peer_a
    cap_add: [NET_ADMIN]
    networks:
      lan_a: { ipv4_address: 10.21.0.20 }
    environment:
      ROLE:          peer
      PEER_NAME:     A
      WAIT_FOR_PEER: B
      SIGNAL_DIR:    /var/lib/ice3-signal
      STUN_URI:      stun://10.41.0.10:3478
      NAT_GATEWAY:   10.21.0.1
      # Empty TURN list — the scenario forbids relay.
      TURN_URI:      ""
      ICE_HOST_ONLY: "false"
      ICE_DEBUG:     "1"
    depends_on:
      stun:        { condition: service_healthy }
      nat_a:       { condition: service_healthy }
      coordinator: { condition: service_started }
    volumes:
      - signal:/var/lib/ice3-signal

  peer_b:
    build:
      context: ../ice-3node/peer
      network: host
    container_name: icesrflx_peer_b
    cap_add: [NET_ADMIN]
    networks:
      lan_b: { ipv4_address: 10.31.0.20 }
    environment:
      ROLE:          peer
      PEER_NAME:     B
      WAIT_FOR_PEER: A
      SIGNAL_DIR:    /var/lib/ice3-signal
      STUN_URI:      stun://10.41.0.10:3478
      NAT_GATEWAY:   10.31.0.1
      TURN_URI:      ""
      ICE_HOST_ONLY: "false"
      ICE_DEBUG:     "1"
    depends_on:
      stun:        { condition: service_healthy }
      nat_b:       { condition: service_healthy }
      coordinator: { condition: service_started }
    volumes:
      - signal:/var/lib/ice3-signal

networks:
  net:
    driver: bridge
    ipam:
      config:
        - subnet:  10.41.0.0/24
          gateway: 10.41.0.254
  lan_a:
    driver: bridge
    ipam:
      config:
        - subnet:  10.21.0.0/24
          gateway: 10.21.0.254
  lan_b:
    driver: bridge
    ipam:
      config:
        - subnet:  10.31.0.0/24
          gateway: 10.31.0.254

volumes:
  signal:
