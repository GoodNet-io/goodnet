# TURN-over-TCP ICE topology (RFC 5389 §7.2.2 + RFC 6062).
#
# Two peers, each behind its own symmetric NAT, with STUN + TURN
# servers on the "Internet" subnet. Peers talk STUN to the TURN
# server over TCP (length-prefix framing) and request a TCP relay
# allocation. Symmetric NAT makes srflx unusable cross-LAN; the only
# working nominated pair is relay/relay, with the relay-side allocation
# carried over TCP.
#
# This validates two code paths that ice-relay does *not* exercise:
#   * STUN-over-TCP framing on the peer↔TURN-server hop (TurnClient
#     opens a gn.link.tcp connection to the TURN server, not UDP).
#   * REQUESTED-TRANSPORT=6 in TURN ALLOCATE — the relay accepts the
#     remote peer's data via Connect / ConnectionBind methods instead
#     of ChannelBind / Send-Indication.
#
# Pass criterion: both reports nominated=true, uses_relay=true, and
# at least one relay candidate was gathered. transport label varies
# by which RFC-6062 sub-method was used at gather time — we don't pin
# it; the harness logs it for forensic visibility.
#
# Subnets are offset by +4 from ../ice-3node/docker-compose.yml
# (10.44.x / 10.24.x / 10.34.x) so this stack can coexist with the
# 3-node / ice-srflx / ice-relay stacks on the same docker daemon.

services:
  stun:
    build:
      context: ../ice-3node/stun
      network: host
    container_name: icetcp_stun
    networks:
      net: { ipv4_address: 10.44.0.10 }
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -uz 127.0.0.1 3478"]
      interval: 2s
      retries: 10

  turn:
    build:
      context: ../ice-3node/turn
      network: host
    container_name: icetcp_turn
    networks:
      net: { ipv4_address: 10.44.0.11 }
    environment:
      TURN_USER:   goodnet
      TURN_PASS:   bench-only-credentials
      TURN_REALM:  ice3.local
    healthcheck:
      # coturn listens on both UDP and TCP 3478 by default; the UDP
      # probe is enough to gate readiness — TCP listener is ready by
      # the same epoll-loop bring-up.
      test: ["CMD", "sh", "-c", "nc -uz 127.0.0.1 3478"]
      interval: 2s
      retries: 10

  coordinator:
    build:
      context: ../ice-3node/peer
      network: host
    container_name: icetcp_coordinator
    networks:
      net: { ipv4_address: 10.44.0.12 }
    environment:
      ROLE: coordinator
    volumes:
      - signal:/var/lib/ice3-signal

  nat_a:
    build:
      context: ../ice-3node/nat-a
      network: host
    container_name: icetcp_nat_a
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.rp_filter: 0
      net.ipv4.conf.default.rp_filter: 0
      net.ipv6.conf.all.forwarding: 1
    networks:
      lan_a: { ipv4_address: 10.24.0.1 }
      net:   { ipv4_address: 10.44.0.20 }
    environment:
      NAT_MODE:   symmetric
      LAN_SUBNET: 10.24.0.0/24
      WAN_SUBNET: 10.44.0.0/24
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/nat-ready"]
      interval: 1s
      timeout: 3s
      retries: 15
      start_period: 0s

  nat_b:
    build:
      context: ../ice-3node/nat-a
      network: host
    container_name: icetcp_nat_b
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.rp_filter: 0
      net.ipv4.conf.default.rp_filter: 0
      net.ipv6.conf.all.forwarding: 1
    networks:
      lan_b: { ipv4_address: 10.34.0.1 }
      net:   { ipv4_address: 10.44.0.30 }
    environment:
      NAT_MODE:   symmetric
      LAN_SUBNET: 10.34.0.0/24
      WAN_SUBNET: 10.44.0.0/24
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/nat-ready"]
      interval: 1s
      timeout: 3s
      retries: 15
      start_period: 0s

  peer_a:
    build:
      context: ../ice-3node/peer
      network: host
    container_name: icetcp_peer_a
    cap_add: [NET_ADMIN]
    networks:
      lan_a: { ipv4_address: 10.24.0.20 }
    environment:
      ROLE:                          peer
      PEER_NAME:                     A
      WAIT_FOR_PEER:                 B
      SIGNAL_DIR:                    /var/lib/ice3-signal
      STUN_URI:                      stun://10.44.0.10:3478
      TURN_URI:                      turn://goodnet:bench-only-credentials@10.44.0.11:3478
      ICE_HOST_ONLY:                 "false"
      ICE_DEBUG:                     "1"
      ICE_TURN_TCP:                  "true"
      ICE_TURN_REQUESTED_TRANSPORT:  "tcp"
      NAT_GATEWAY:                   10.24.0.1
      HARNESS_TIMEOUT_S:             "60"
    depends_on:
      stun:        { condition: service_healthy }
      turn:        { condition: service_healthy }
      nat_a:       { condition: service_healthy }
      coordinator: { condition: service_started }
    volumes:
      - signal:/var/lib/ice3-signal

  peer_b:
    build:
      context: ../ice-3node/peer
      network: host
    container_name: icetcp_peer_b
    cap_add: [NET_ADMIN]
    networks:
      lan_b: { ipv4_address: 10.34.0.20 }
    environment:
      ROLE:                          peer
      PEER_NAME:                     B
      WAIT_FOR_PEER:                 A
      SIGNAL_DIR:                    /var/lib/ice3-signal
      STUN_URI:                      stun://10.44.0.10:3478
      TURN_URI:                      turn://goodnet:bench-only-credentials@10.44.0.11:3478
      ICE_HOST_ONLY:                 "false"
      ICE_DEBUG:                     "1"
      ICE_TURN_TCP:                  "true"
      ICE_TURN_REQUESTED_TRANSPORT:  "tcp"
      NAT_GATEWAY:                   10.34.0.1
      HARNESS_TIMEOUT_S:             "60"
    depends_on:
      stun:        { condition: service_healthy }
      turn:        { condition: service_healthy }
      nat_b:       { condition: service_healthy }
      coordinator: { condition: service_started }
    volumes:
      - signal:/var/lib/ice3-signal

networks:
  net:
    driver: bridge
    ipam:
      config:
        - subnet:  10.44.0.0/24
          gateway: 10.44.0.254
  lan_a:
    driver: bridge
    ipam:
      config:
        - subnet:  10.24.0.0/24
          gateway: 10.24.0.254
  lan_b:
    driver: bridge
    ipam:
      config:
        - subnet:  10.34.0.0/24
          gateway: 10.34.0.254

volumes:
  signal:
