# Roadmap status resolver — explicit map from feature bullet name
# (the bold-bracketed identifier in docs/ROADMAP.en.md) to a check
# rule the resolver can evaluate against the working tree.
#
# Rule types:
#   plugin_exists: PATH        — directory exists relative to repo root
#   extension_registered: ID   — grep for gn_extension_id = "ID" or
#                                similar registration in plugins/
#   symbol_in_kernel: SYM      — grep for SYM under core/ or sdk/
#   kernel_feature: TOKEN      — grep across core/ + plugins/ for TOKEN
#   file_exists: PATH          — explicit file path
#   any: [rule, rule, ...]     — pass if any inner rule passes
#   all: [rule, rule, ...]     — pass if every inner rule passes
#
# Each entry MAY also carry `partial_if`: a rule that, when matched
# without the main rule matching, downgrades the status from
# `missing` to `partial`. Useful for features where a precursor is
# in tree but the full piece is not.

features:
  "NAT-traversal pipeline":
    rule:
      any:
        - plugin_exists: plugins/links/ice
        - plugin_exists: plugins/extensions/nat-traversal
        - extension_registered: gn.nat
    partial_if:
      extension_registered: gn.heartbeat

  "Multi-path scheduler":
    rule:
      any:
        - plugin_exists: plugins/strategies/float_send_rtt
        - extension_registered: gn.strategy.rtt-optimal
    partial_if:
      symbol_in_kernel: pick_conn

  "Directed relay → direct upgrade":
    rule:
      any:
        - file_exists: plugins/links/ice/session.cpp
        - plugin_exists: plugins/extensions/relay-upgrade
        - extension_registered: gn.relay

  "Kademlia-style DHT":
    rule:
      plugin_exists: plugins/handlers/kademlia

  "Address-based forwarding":
    rule:
      any:
        - plugin_exists: plugins/handlers/router
        - symbol_in_kernel: route_to_pk

  "KV storage handler":
    rule:
      any:
        - plugin_exists: plugins/handlers/store
        - extension_registered: gn.store

  "Gossip sync handler":
    rule:
      plugin_exists: plugins/handlers/gossip

  "Offline outbound queue":
    rule:
      any:
        - kernel_feature: outbound_queue
        - kernel_feature: offline_queue

  "Fuzz harness":
    rule:
      any:
        - file_exists: tests/fuzz/CMakeLists.txt
        - file_exists: fuzz/CMakeLists.txt

  "Coverage gating":
    rule:
      any:
        - kernel_feature: llvm-cov
        - kernel_feature: gcov
        - kernel_feature: --coverage

  "Plugin templates and scaffolder":
    rule:
      file_exists: nix/plugin.nix

  "Test vectors":
    rule:
      any:
        - plugin_exists: tests/vectors
        - plugin_exists: docs/test-vectors

  "Raw inject bridge":
    rule:
      plugin_exists: plugins/links/raw_inject

  "DPLPMTUD active path-MTU probing":
    rule:
      all:
        - plugin_exists: plugins/links/ice
        - file_exists: plugins/links/ice/path_mtu.hpp

  "Multi-TURN fallback":
    rule:
      all:
        - kernel_feature: turn_servers
        - kernel_feature: turn_backup_interval_s

  "IPv6 mDNS dual-stack":
    rule:
      kernel_feature: "ff02::fb"

  "Subprocess SECURITY/HANDLER worker proxy":
    rule:
      symbol_in_kernel: security_vtable_proxy

  "Recv-side parallel decrypt":
    rule:
      symbol_in_kernel: decrypt_batch_transport

  "Link capability gate":
    rule:
      file_exists: core/kernel/link_capability.hpp

  "DynamicRuntime dlsym cache":
    rule:
      symbol_in_kernel: DynamicPluginSymbols

  "Required-plugin manifest pinning":
    rule:
      any:
        - symbol_in_kernel: ManifestEntry
        - file_exists: core/plugin/plugin_manifest.hpp

  "gn_core_unload_plugin hot-reload":
    rule:
      symbol_in_kernel: gn_core_unload_plugin

  "Subprocess HOST_CALL slot completion":
    rule:
      any:
        - symbol_in_kernel: GN_WIRE_HOST_SLOT_NOTIFY_CONNECT
        - file_exists: sdk/remote/slots.h

  "Per-slot reply-timeout override":
    rule:
      symbol_in_kernel: set_reply_timeout_for_slot

  "Wire codec GN_ERR_WIRE_DECODE":
    rule:
      symbol_in_kernel: GN_ERR_WIRE_DECODE

  "Port mapping (UPnP / PCP / NAT-PMP)":
    rule:
      plugin_exists: plugins/links/portmap
